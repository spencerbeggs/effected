#:schema https://raw.githubusercontent.com/spencerbeggs/effected/main/schemas/1.0/config.json

# ./ui and ./ui/testing name the root's (and ./ui's) types through the package's own name; keep those imports
# external in the declarations so each entry refers to the other's types instead of carrying copies. The match is
# exact, so each subpath is listed.
[package.build]
dtsExternals = ["@effected/cli-kit", "@effected/cli-kit/ui"]

[package.build.meta.tsdoc]
suppressWarnings = [
  { messageId = "ae-forgotten-export", pattern = "_base" },
  # The second API Extractor pass resolves ./ui's self-referencing "@effected/cli-kit" import to the built root
  # declarations, but still reports every root type it reaches as forgotten. Scoped to the two ui entries only. What it
  # would hide (a ui-local declaration left unexported) is pinned by __test__/declarations.test.ts over the built ui.d.ts.
  { messageId = "ae-forgotten-export", pattern = 'entry point ui(?:-testing)?\.d\.ts$' },
]
