name: Slow Tests

# The two tiers of the vitest suite that run with coverage off, beside the Silk workflow's `ci:test`
# (EFFECTED_TEST_TIER=fast, with coverage and its thresholds) rather than after it, so a pull
# request waits for the slowest of the three and not their sum.
#
# - Slow Tests: the packed-install e2es, the reload and bundle tests and the sweeps listed in
#   vitest.config.ts's SLOW_TESTS (EFFECTED_TEST_TIER=slow). The packed-install e2e packs the plugin
#   with everything it depends on, so this job alone builds that whole closure.
# - Hostile Tests: every *.hostile.test.ts file (EFFECTED_TEST_TIER=hostile), which bound how work
#   grows with input size. They run one file at a time, so no other file shares the runner while
#   they measure (#1387), and in a job of their own, so they neither wait for the slow tier's build
#   nor go unreported when a slow test fails.
#
# Both run on every pull request, not on a schedule: the hostile tier holds security regression
# suites (shell, glob and lockfile hostility) that must not merge red. Coverage is off because
# these files exercise code the fast tier already covers, and v8 instrumentation made them two to
# three times slower.
#
# Cache trust comes from the job's GitHub token, not from a shared secret. The job signs in to the
# hosted turbo cache at cache.savvyweb.systems, which reads the token's claims and gives a pull
# request its own lane: it reads what main wrote and writes only where later pull request runs on
# the same ref can see. A push to main writes the lane every run reads. A fork's pull_request run
# cannot mint the token, so its sign-in fails and the action falls back to the embedded cache
# server on the GitHub Actions cache.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: slow-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # signs the job in to the hosted turbo cache
jobs:
  slow:
    name: Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Runtime
        uses: savvy-web/silk-runtime-action@v2
        with:
          turbo-api: https://cache.savvyweb.systems

      - name: Run the slow tier
        run: pnpm run ci:test:slow

  hostile:
    name: Hostile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Runtime
        uses: savvy-web/silk-runtime-action@v2
        with:
          turbo-api: https://cache.savvyweb.systems

      - name: Run the hostile tier
        run: pnpm run ci:test:hostile
        env:
          # Growth appends every measurement here; the next step prints the checks nearest their bounds.
          EFFECTED_GROWTH_REPORT: ${{ runner.temp }}/growth.jsonl

      # A pass says nothing of a check's margin, and the margin differs by machine. This table is how the runner
      # says which checks are the next to fail. It runs when the tier failed too, and never fails the job itself.
      - name: Report the growth checks nearest their bounds
        if: always()
        run: pnpm exec tsx lib/scripts/growth-report.ts "$RUNNER_TEMP/growth.jsonl" | tee -a "$GITHUB_STEP_SUMMARY"
