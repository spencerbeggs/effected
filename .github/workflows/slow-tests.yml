name: Slow Tests

# The slow tier of the vitest suite: the CPU-heavy property and fuzz sweeps, the packed-install e2es
# and the reload tests listed in vitest.config.ts's SLOW_TESTS. The Silk workflow's `ci:test` runs
# everything else (EFFECTED_TEST_TIER=fast, with coverage and its thresholds); this job runs these
# files alone (EFFECTED_TEST_TIER=slow) with coverage off, beside it rather than after it, so a PR
# waits for the slower of the two instead of their sum. The TIMING_TESTS among them, which bound a
# timing growth ratio, run afterwards one file at a time (EFFECTED_TEST_TIER=timing), so no other
# file shares the runner while they measure (#1387). It runs on every pull request, not on a
# schedule, because the tier holds security regression suites (shell, glob and lockfile hostility)
# that must not merge red. Coverage is off because these files exercise code the fast tier already
# covers, and v8 instrumentation made them two to three times slower.
#
# Cache trust comes from the job's GitHub token, not from a shared secret. The job signs in to the
# hosted turbo cache at cache.savvyweb.systems, which reads the token's claims and gives a pull
# request its own lane: it reads what main wrote and writes only where later pull request runs on
# the same ref can see. A push to main writes the lane every run reads. A fork's pull_request run
# cannot mint the token, so its sign-in fails and the action falls back to the embedded cache
# server on the GitHub Actions cache.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: slow-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  # Signs the job in to the hosted turbo cache.
  id-token: write

jobs:
  slow:
    name: Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Runtime
        uses: savvy-web/silk-runtime-action@v2
        with:
          turbo-api: https://cache.savvyweb.systems

      - name: Run the slow tier
        run: pnpm run ci:test:slow
