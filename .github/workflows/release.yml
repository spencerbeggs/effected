name: Silk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, changeset-release/main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in dry-run mode
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow
    uses: spencerbeggs/.github/.github/workflows/release.yml@dev
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
      attestations: write
      checks: write
      artifact-metadata: write
    with:
      dry-run: ${{ inputs.dry_run || false }}
      auto-merge: "squash"
      skip-claude-review: false
      # Fails the validation phase when the effected catalog has drifted from
      # the kit's next release versions. Exit-code only: the gate's own non-zero
      # exit is the sole failure signal; stderr is not inspected.
      on-build: pnpm catalog:check
    secrets: inherit
